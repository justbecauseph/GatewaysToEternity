# Builds the mod and uploads the jar so it can be downloaded from the Actions run.
#
# Jars are renamed to <Mod>-<mcVersion>-<version>+<short sha> so a download is traceable to
# the exact commit. The build's own version is left alone -- changing it would change the
# maven coordinates the rest of the stack resolves by.
#
# Nothing here publishes anywhere. Artifacts live on the workflow run only.
name: Build

on:
  push:
    branches: [ "26.2-architectury" ]
  pull_request:
    branches: [ "26.2-architectury" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Jade is a compile dependency, but no 26.2 build is mirrored to the maven this stack
      # reads (`maven.shadowsoffire.dev` stops at 26.1). Build it from upstream and install it
      # under the coordinate the stack expects, which is not the one Jade publishes for itself.
      # Cached on Jade's commit, so this only runs when upstream actually moves.
      - name: Resolve Jade commit
        id: jade-rev
        run: echo "sha=$(git ls-remote https://github.com/Snownee/Jade.git 26.2-neoforge | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Jade from cache
        id: jade-cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/snownee/jade
          key: jade-${{ steps.jade-rev.outputs.sha }}

      - name: Build and install Jade
        if: steps.jade-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 26.2-neoforge https://github.com/Snownee/Jade.git "$RUNNER_TEMP/Jade"
          cd "$RUNNER_TEMP/Jade"
          chmod +x gradlew
          ./gradlew build -x test --no-daemon
          # Jade emits several jars (api, sources, the mod). `ls -S` sorts by size and the
          # full mod jar dwarfs the others; echo the pick so a wrong one shows up in the log
          # rather than being silently installed under the coordinate.
          ls -l build/libs
          jar=$(ls -S build/libs/*.jar | grep -v -e '-sources[.]jar$' -e '-api[.]jar$' | head -1)
          test -n "$jar" || { echo "::error::Jade produced no usable jar"; exit 1; }
          echo "Installing Jade jar: $jar"
          mvn -q -B install:install-file \
            -DgroupId=snownee.jade -DartifactId=Jade-NeoForge -Dversion=26.2-26.2.8 \
            -Dpackaging=jar -Dfile="$jar"

      # Upstream mods in this stack are not published to any maven, so CI builds them into the
      # runner's local maven first. Same order as the local build.
      - name: Build Placebo (26.2-architectury)
        run: |
          git clone --depth 1 --branch 26.2-architectury https://github.com/justbecauseph/Placebo.git "$RUNNER_TEMP/Placebo"
          cd "$RUNNER_TEMP/Placebo"
          chmod +x gradlew
          ./gradlew :neoforge:publishToMavenLocal --no-daemon
      - name: Build Apothic-Attributes (26.2-architectury)
        run: |
          git clone --depth 1 --branch 26.2-architectury https://github.com/justbecauseph/Apothic-Attributes.git "$RUNNER_TEMP/Apothic-Attributes"
          cd "$RUNNER_TEMP/Apothic-Attributes"
          chmod +x gradlew
          ./gradlew :neoforge:publishToMavenLocal --no-daemon

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Stage jars with commit hash
        id: stage
        run: |
          short="${GITHUB_SHA::7}"
          mkdir -p ci-artifacts
          # `-raw` is the shadow plugin's pre-merge jar and `-sources` is not a runnable mod;
          # shipping either would just invite someone to install the wrong one.
          # Both loaders emit the same file name, so the loader has to go into the staged name --
          # without it the second copy silently overwrites the first and only one loader ever ships.
          for loader in neoforge fabric; do
            for jar in "$loader"/build/libs/*.jar; do
              [ -e "$jar" ] || continue
              case "$jar" in *-raw.jar|*-sources.jar) continue ;; esac
              base=$(basename "$jar" .jar)
              cp "$jar" "ci-artifacts/${base}-${loader}+${short}.jar"
            done
          done
          ls -l ci-artifacts
          primary=$(find ci-artifacts -name '*.jar' | sort | head -1)
          test -n "$primary" || { echo "::error::no jars were produced"; exit 1; }
          # The zip holds both loaders, so its name should not claim one of them.
          echo "name=$(basename "$primary" .jar | sed -E 's/-(neoforge|fabric)\+/+/')" >> "$GITHUB_OUTPUT"

      - name: Upload jars
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ci-artifacts/*.jar
          if-no-files-found: error
