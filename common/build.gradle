loom {
    accessWidenerPath = file("src/main/resources/gateways.accesswidener")
}

architectury {
    common(rootProject.platforms.split(","))
}

dependencies {
    // Fabric loader is on the compile classpath only for its @Environment annotations.
    // Do NOT use any other class from it in common code.
    implementation "net.fabricmc:fabric-loader:${rootProject.fabricLoaderVersion}"

    api "dev.architectury:architectury:${rootProject.architecturyVersion}"

    // Use the sibling Fabric artifact when it is available so common compilation sees the same
    // API that the Fabric project and runtime use. Keep the published coordinate as a fallback
    // for standalone checkouts that do not have the sibling artifact yet.
    def placeboFabricJar = file("${rootProject.projectDir}/../Placebo/fabric/build/libs/Placebo-${rootProject.mcVersion}-${rootProject.placeboVersion}.jar")
    if (placeboFabricJar.exists()) {
        api files(placeboFabricJar)
    } else {
        api "dev.shadowsoffire:Placebo:${rootProject.mcVersion}-${rootProject.placeboVersion}"
    }
    api "dev.shadowsoffire:ApothicAttributes:${rootProject.mcVersion}-${rootProject.attributeslibVersion}"

    // JEI and Jade expose loader-neutral API packages. Their annotated plugins live in common so
    // both platform jars discover the same optional integration without bundling either mod.
    compileOnly("mezz.jei:jei-${rootProject.mcVersion}-common-api:${rootProject.jeiVersion}") { transitive = false }
    compileOnly("maven.modrinth:jade:${rootProject.jadeVersion}+fabric") { transitive = false }

    // javax.annotation.Nullable came transitively from the NeoForge dependency in the old
    // single-project build. Common has no NeoForge on its classpath, so it must be declared.
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

// Datagen stays NeoForge-only (it is the only loader with a data generator here), but its output is
// loader-neutral JSON that both jars need. Writing it into :common is what gets it into both -- see
// neoforge/build.gradle, which points the generator here.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
