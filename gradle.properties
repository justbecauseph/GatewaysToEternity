org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Basic Information
fileName=GatewaysToEternity
modName=Gateways To Eternity
modGroup=dev.shadowsoffire
modid=gateways
author=Shadows_of_Fire
desc=Adds combat-based events which provide various rewards and challenges.
version=7.0.0

# Dependencies
mcVersion=26.2
javaVersion=25
forgeVersion=26.2.0.43-beta
jeiVersion=30.16.0.130
jadeVersion=26.2.8
placeboVersion=11.0.0
# Required since Placebo's Phase 2a split -- Placebo's POM strips dependencies, so consumers declare it.
architecturyVersion=21.0.7
attributeslibVersion=4.0.0

# Multiloader (Architectury). Phase 2a ships NeoForge only.
platforms=fabric,neoforge
fabricLoaderVersion=0.19.3
fabricApiVersion=0.155.2+26.2

# Mixins
mixin=true
mixinVersion=0.8.7

# Publishing
# Dependency lists are comma-separated. Each entry is "slug" (both platforms) or "curseforgeSlug|modrinthSlug".
requiredDeps=placebo, apothic-attributes
#optionalDeps=
#incompatibleDeps=
releaseType=release
modLoaders=NeoForge
curseforgeProjectId=417802
modrinthProjectId=8OIeAukW

# Tests
enableTests=false
